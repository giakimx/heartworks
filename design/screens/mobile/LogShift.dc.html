<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Log your shift</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&amp;family=Instrument+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Instrument Sans',system-ui,sans-serif;background:#FBF6F1}
a{color:#8A2E1A}a:hover{color:#5E1E10}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; padding: 12px 24px 28px; display: flex; flex-direction: column; gap: 22px; color: #1F1A17; font-family: 'Instrument Sans', system-ui, sans-serif; background: radial-gradient(120% 420px at 0% 0%, #FBD9CB 0%, rgba(251,217,203,0) 70%), radial-gradient(100% 380px at 100% 0%, #F7D4DD 0%, rgba(247,212,221,0) 70%), radial-gradient(90% 300px at 50% 0%, #FCEBCB 0%, rgba(252,235,203,0) 75%), #FBF6F1;">
<div style="display: flex; align-items: center; height: 44px;">
<a href="Going.dc.html" aria-label="Back" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; margin-left: -10px; color: #1F1A17;">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
</a>
</div>
<div style="display: flex; flex-direction: column; gap: 8px;">
<h1 style="margin: 0; font-family: 'Young Serif', Georgia, serif; font-weight: 400; font-size: 32px; line-height: 1.1; letter-spacing: -0.5px;">How was Friday?</h1>
<p style="margin: 0; font-size: 16px; line-height: 1.5; color: #6B5F58;">Paint the building! at Detroit Body Garage</p>
</div>
<div style="display: flex; flex-direction: column; gap: 14px; padding: 18px; border-radius: 20px; background: rgba(255,255,255,0.8); border: 1px solid rgba(31,26,23,0.08);">
<div style="font-size: 13px; font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase; color: #6B5F58;">Hours you put in</div>
<div style="display: flex; align-items: center; justify-content: space-between;">
<button type="button" aria-label="One hour less" onClick="{{ less }}" style="display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 50%; border: 1px solid rgba(31,26,23,0.14); background: #FBF6F1; color: #1F1A17;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg>
</button>
<div style="display: flex; align-items: baseline; gap: 6px;">
<div style="font-family: 'Young Serif', Georgia, serif; font-size: 48px; line-height: 1;">{{ hours }}</div>
<div style="font-size: 16px; color: #6B5F58;">{{ unit }}</div>
</div>
<button type="button" aria-label="One hour more" onClick="{{ more }}" style="display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 50%; border: 1px solid rgba(31,26,23,0.14); background: #FBF6F1; color: #1F1A17;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
</button>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 12px;">
<div style="font-size: 13px; font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase; color: #6B5F58;">Skills you actually used</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px;">
<sc-for list="{{ skills }}" as="chip" hint-placeholder-count="4">
<sc-if value="{{ chip.on }}" hint-placeholder-val="{{ false }}">
<button type="button" aria-pressed="true" onClick="{{ chip.toggle }}" style="height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #1F1A17; background: #1F1A17; color: #FFFFFF; font-size: 15px; font-weight: 500;">{{ chip.label }}</button>
</sc-if>
<sc-if value="{{ chip.off }}" hint-placeholder-val="{{ true }}">
<button type="button" aria-pressed="false" onClick="{{ chip.toggle }}" style="height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid rgba(31,26,23,0.12); background: rgba(255,255,255,0.75); color: #1F1A17; font-size: 15px; font-weight: 500;">{{ chip.label }}</button>
</sc-if>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px;">
<label for="note" style="font-size: 13px; font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase; color: #6B5F58;">One line for your profile (optional)</label>
<input id="note" type="text" placeholder="Primed and painted the east wall" style="height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 14px; border: 1px solid rgba(31,26,23,0.14); background: rgba(255,255,255,0.8); font-family: inherit; font-size: 16px; color: #1F1A17;">
</div>
<div style="flex-grow: 1;"></div>
<div style="display: flex; flex-direction: column; gap: 12px;">
<div style="text-align: center; font-size: 13px; line-height: 1.5; color: #6B5F58;">Detroit Body Garage confirms with one tap, then it's stamped on your profile as verified experience.</div>
<a href="Profile.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 999px; background: #1F1A17; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none;">Log shift</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
state = { hours: 3, used: ['Mural painting', 'Teamwork'] };
renderVals() {
const h = this.state.hours;
return {
hours: h,
unit: h === 1 ? 'hour' : 'hours',
less: () => this.setState({ hours: Math.max(1, h - 1) }),
more: () => this.setState({ hours: Math.min(12, h + 1) }),
skills: ['Mural painting', 'Surface prep', 'Teamwork', 'Something else'].map((label) => {
const on = this.state.used.includes(label);
return { label: label, on: on, off: !on, toggle: () => this.setState({ used: on ? this.state.used.filter((x) => x !== label) : this.state.used.concat([label]) }) };
})
};
}
}
</script>
</body>
</html>
