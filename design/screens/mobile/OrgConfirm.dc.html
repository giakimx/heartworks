<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Confirm shift</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&amp;family=Instrument+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Instrument Sans',system-ui,sans-serif;background:#FBF6F1}
a{color:#8A2E1A}a:hover{color:#5E1E10}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; padding: 12px 24px 28px; display: flex; flex-direction: column; gap: 20px; color: #1F1A17; font-family: 'Instrument Sans', system-ui, sans-serif; background: radial-gradient(120% 420px at 0% 0%, #FBD9CB 0%, rgba(251,217,203,0) 70%), radial-gradient(100% 380px at 100% 0%, #F7D4DD 0%, rgba(247,212,221,0) 70%), radial-gradient(90% 300px at 50% 0%, #FCEBCB 0%, rgba(252,235,203,0) 75%), #FBF6F1;">
<div style="display: flex; align-items: center; height: 44px;">
<a href="OrgHome.dc.html" aria-label="Back to org home" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; margin-left: -10px; color: #1F1A17;">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
</a>
</div>
<div style="display: flex; flex-direction: column; gap: 6px;">
<div style="font-size: 14px; font-weight: 500; color: #6B5F58;">Wall prep day · Sat, Sep 12</div>
<h1 style="margin: 0; font-family: 'Young Serif', Georgia, serif; font-weight: 400; font-size: 30px; line-height: 1.15; letter-spacing: -0.4px;">Who showed up?</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.5; color: #6B5F58;">Untick anyone who didn't make it. Hours are what they reported.</p>
</div>
<div style="display: flex; flex-direction: column; border-radius: 20px; background: rgba(255,255,255,0.85); border: 1px solid rgba(31,26,23,0.08); padding: 4px 16px;">
<sc-for list="{{ people }}" as="p" hint-placeholder-count="4">
<button type="button" aria-pressed="{{ p.pressed }}" onClick="{{ p.toggle }}" style="display: flex; align-items: center; gap: 12px; min-height: 76px; padding: 0; border: 0; border-bottom: 1px solid rgba(31,26,23,0.07); background: transparent; text-align: left; color: #1F1A17;">
<div style="flex-shrink: 0; width: 40px; height: 40px; border-radius: 50%; background: {{ p.color }}; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700;">{{ p.initials }}</div>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
<div style="font-size: 16px; font-weight: 600;">{{ p.name }}</div>
<div style="font-size: 13px; color: #6B5F58;">{{ p.detail }}</div>
</div>
<sc-if value="{{ p.on }}" hint-placeholder-val="{{ true }}">
<div style="flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%; background: #1F1A17; color: #FFFFFF; display: flex; align-items: center; justify-content: center;">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
</div>
</sc-if>
<sc-if value="{{ p.off }}" hint-placeholder-val="{{ false }}">
<div style="flex-shrink: 0; width: 28px; height: 28px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid rgba(31,26,23,0.28);"></div>
</sc-if>
</button>
</sc-for>
</div>
<div style="flex-grow: 1;"></div>
<div style="display: flex; flex-direction: column; gap: 12px;">
<div style="text-align: center; font-size: 13px; line-height: 1.5; color: #6B5F58;">{{ summary }}</div>
<a href="OrgHome.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 999px; background: #1F1A17; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none;">{{ cta }}</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
state = { out: [] };
renderVals() {
const base = [
{ id: 'a', initials: 'GK', name: 'Gia K.', color: '#F2B8A0', hours: 3, detail: '3 hrs · Surface prep, teamwork' },
{ id: 'b', initials: 'ER', name: 'Elena R.', color: '#A9D4B8', hours: 3, detail: '3 hrs · Surface prep' },
{ id: 'c', initials: 'MT', name: 'Marcus T.', color: '#C9B8E8', hours: 2, detail: '2 hrs · Teamwork' },
{ id: 'd', initials: 'JW', name: 'Jordan W.', color: '#F3D48A', hours: 3, detail: '3 hrs · Surface prep, carpentry' }
];
const out = this.state.out;
const kept = base.filter((p) => !out.includes(p.id));
const hrs = kept.reduce((n, p) => n + p.hours, 0);
return {
people: base.map((p) => {
const on = !out.includes(p.id);
return Object.assign({}, p, { on: on, off: !on, pressed: on ? 'true' : 'false', toggle: () => this.setState({ out: on ? out.concat([p.id]) : out.filter((x) => x !== p.id) }) });
}),
summary: hrs + ' verified hours go on ' + kept.length + (kept.length === 1 ? ' profile' : ' profiles') + ' as stamps.',
cta: 'Confirm ' + kept.length + (kept.length === 1 ? ' volunteer' : ' volunteers')
};
}
}
</script>
</body>
</html>
