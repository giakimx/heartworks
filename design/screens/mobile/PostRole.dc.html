<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Post a role</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&amp;family=Instrument+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Instrument Sans',system-ui,sans-serif;background:#FBF6F1}
a{color:#8A2E1A}a:hover{color:#5E1E10}
button{font-family:inherit;cursor:pointer}
input,textarea{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 1400px; box-sizing: border-box; overflow: hidden; padding: 12px 24px 32px; display: flex; flex-direction: column; gap: 22px; color: #1F1A17; font-family: 'Instrument Sans', system-ui, sans-serif; background: radial-gradient(120% 420px at 0% 0%, #FBD9CB 0%, rgba(251,217,203,0) 70%), radial-gradient(100% 380px at 100% 0%, #F7D4DD 0%, rgba(247,212,221,0) 70%), radial-gradient(90% 300px at 50% 0%, #FCEBCB 0%, rgba(252,235,203,0) 75%), #FBF6F1;">
<div style="display: flex; align-items: center; justify-content: space-between; height: 44px;">
<a href="OrgHome.dc.html" aria-label="Back to org home" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; margin-left: -10px; color: #1F1A17;">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
</a>
<a href="OrgHome.dc.html" style="font-size: 14px; font-weight: 600; color: #6B5F58; text-decoration: none; padding: 12px 0;">Save draft</a>
</div>
<div style="display: flex; flex-direction: column; gap: 8px;">
<h1 style="margin: 0; font-family: 'Young Serif', Georgia, serif; font-weight: 400; font-size: 30px; line-height: 1.15; letter-spacing: -0.4px;">Post a role</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.5; color: #6B5F58;">Two minutes. Say what needs doing and what someone walks away knowing.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 8px;">
<label for="title" style="font-size: 13px; font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase; color: #6B5F58;">Role title</label>
<input id="title" type="text" value="{{ title }}" onChange="{{ setTitle }}" style="height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 14px; border: 1px solid rgba(31,26,23,0.14); background: rgba(255,255,255,0.8); font-size: 16px; color: #1F1A17;">
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
<div style="display: flex; flex-direction: column; gap: 8px;">
<label for="date" style="font-size: 13px; font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase; color: #6B5F58;">Date</label>
<input id="date" type="text" placeholder="Sat, Oct 3" style="height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 14px; border: 1px solid rgba(31,26,23,0.14); background: rgba(255,255,255,0.8); font-size: 16px; color: #1F1A17;">
</div>
<div style="display: flex; flex-direction: column; gap: 8px;">
<label for="time" style="font-size: 13px; font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase; color: #6B5F58;">Time</label>
<input id="time" type="text" placeholder="10 AM to 1 PM" style="height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 14px; border: 1px solid rgba(31,26,23,0.14); background: rgba(255,255,255,0.8); font-size: 16px; color: #1F1A17;">
</div>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-radius: 16px; background: rgba(255,255,255,0.8); border: 1px solid rgba(31,26,23,0.08);">
<div style="display: flex; flex-direction: column; gap: 2px;">
<div style="font-size: 16px; font-weight: 600;">Volunteers needed</div>
<div style="font-size: 13px; color: #6B5F58;">We stop requests when it's full</div>
</div>
<div style="display: flex; align-items: center; gap: 12px;">
<button type="button" aria-label="One fewer" onClick="{{ less }}" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(31,26,23,0.14); background: #FBF6F1; color: #1F1A17;">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg>
</button>
<div style="min-width: 24px; text-align: center; font-family: 'Young Serif', Georgia, serif; font-size: 24px;">{{ spots }}</div>
<button type="button" aria-label="One more" onClick="{{ more }}" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(31,26,23,0.14); background: #FBF6F1; color: #1F1A17;">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
</button>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; flex-direction: column; gap: 3px;">
<div style="font-size: 13px; font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase; color: #6B5F58;">Skills they'll gain</div>
<div style="font-size: 13px; color: #6B5F58;">This is what we match on. Roles with at least one get seen more.</div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px;">
<sc-for list="{{ taught }}" as="chip" hint-placeholder-count="6">
<sc-if value="{{ chip.on }}" hint-placeholder-val="{{ false }}">
<button type="button" aria-pressed="true" onClick="{{ chip.toggle }}" style="height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #1F1A17; background: #1F1A17; color: #FFFFFF; font-size: 15px; font-weight: 500;">{{ chip.label }}</button>
</sc-if>
<sc-if value="{{ chip.off }}" hint-placeholder-val="{{ true }}">
<button type="button" aria-pressed="false" onClick="{{ chip.toggle }}" style="height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid rgba(31,26,23,0.12); background: rgba(255,255,255,0.75); color: #1F1A17; font-size: 15px; font-weight: 500;">{{ chip.label }}</button>
</sc-if>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 12px;">
<div style="font-size: 13px; font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase; color: #6B5F58;">Skills that help (optional)</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px;">
<sc-for list="{{ needed }}" as="chip" hint-placeholder-count="4">
<sc-if value="{{ chip.on }}" hint-placeholder-val="{{ false }}">
<button type="button" aria-pressed="true" onClick="{{ chip.toggle }}" style="height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #1F1A17; background: #1F1A17; color: #FFFFFF; font-size: 15px; font-weight: 500;">{{ chip.label }}</button>
</sc-if>
<sc-if value="{{ chip.off }}" hint-placeholder-val="{{ true }}">
<button type="button" aria-pressed="false" onClick="{{ chip.toggle }}" style="height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid rgba(31,26,23,0.12); background: rgba(255,255,255,0.75); color: #1F1A17; font-size: 15px; font-weight: 500;">{{ chip.label }}</button>
</sc-if>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px;">
<div style="font-size: 13px; font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase; color: #6B5F58;">Where</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 999px; background: rgba(31,26,23,0.07);">
<sc-for list="{{ modes }}" as="m" hint-placeholder-count="3">
<sc-if value="{{ m.on }}" hint-placeholder-val="{{ false }}">
<button type="button" aria-pressed="true" onClick="{{ m.pick }}" style="height: 44px; border-radius: 999px; border: 0; background: #FFFFFF; color: #1F1A17; font-size: 14px; font-weight: 600; box-shadow: 0 1px 3px rgba(31,26,23,0.12);">{{ m.label }}</button>
</sc-if>
<sc-if value="{{ m.off }}" hint-placeholder-val="{{ true }}">
<button type="button" aria-pressed="false" onClick="{{ m.pick }}" style="height: 44px; border-radius: 999px; border: 0; background: transparent; color: #6B5F58; font-size: 14px; font-weight: 600;">{{ m.label }}</button>
</sc-if>
</sc-for>
</div>
<label for="addr" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%);">Address</label>
<input id="addr" type="text" value="{{ addr }}" onChange="{{ setAddr }}" style="height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 14px; border: 1px solid rgba(31,26,23,0.14); background: rgba(255,255,255,0.8); font-size: 16px; color: #1F1A17;">
</div>
<div style="display: flex; flex-direction: column; gap: 8px;">
<label for="impact" style="font-size: 13px; font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase; color: #6B5F58;">Community impact, one sentence</label>
<textarea id="impact" rows="3" placeholder="What changes in the neighborhood because this got done?" style="box-sizing: border-box; padding: 14px 16px; border-radius: 14px; border: 1px solid rgba(31,26,23,0.14); background: rgba(255,255,255,0.8); font-size: 16px; line-height: 1.4; color: #1F1A17; resize: none;"></textarea>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
<sc-for list="{{ flags }}" as="f" hint-placeholder-count="4">
<label style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 14px; border-radius: 14px; background: rgba(255,255,255,0.7); border: 1px solid rgba(31,26,23,0.08); font-size: 14px; font-weight: 500;"><input type="checkbox" checked="{{ f.on }}" onChange="{{ f.toggle }}" style="width: 18px; height: 18px; accent-color: #1F1A17;">{{ f.label }}</label>
</sc-for>
</div>
<div style="flex-grow: 1;"></div>
<a href="OrgHome.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 999px; background: #1F1A17; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none;">Post role</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1400}}'>
class Component extends DCLogic {
state = { spots: 6, taught: ['Event planning'], needed: [], flags: ['Training provided'], mode: 'On-site', title: 'Opening day greeters', addr: '8635 Mack Ave, Detroit, MI 48214' };
renderVals() {
const mk = (labels, key) => labels.map((label) => {
const on = this.state[key].includes(label);
return { label: label, on: on, off: !on, toggle: () => this.setState({ [key]: on ? this.state[key].filter((x) => x !== label) : this.state[key].concat([label]) }) };
});
const s = this.state.spots;
return {
spots: s,
title: this.state.title,
addr: this.state.addr,
setTitle: (e) => this.setState({ title: e.target.value }),
setAddr: (e) => this.setState({ addr: e.target.value }),
flags: mk(['Training provided', 'Good for groups', 'Background check', 'Minimum age'], 'flags'),
less: () => this.setState({ spots: Math.max(1, s - 1) }),
more: () => this.setState({ spots: Math.min(99, s + 1) }),
taught: mk(['Event planning', 'Public speaking', 'Customer service', 'Organizing', 'Teamwork', 'Add your own'], 'taught'),
needed: mk(['Spanish', 'Design', 'Photography', 'First aid'], 'needed'),
modes: ['On-site', 'Hybrid', 'Remote'].map((label) => ({ label: label, on: this.state.mode === label, off: this.state.mode !== label, pick: () => this.setState({ mode: label }) }))
};
}
}
</script>
</body>
</html>
