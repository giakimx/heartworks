<nav aria-label="Progress" style="display: flex; align-items: center; justify-content: space-between; height: 76px; padding: 0 48px;"><a href="DLanding.dc.html" style="display: flex; align-items: center; gap: 8px; color: #1F1A17; text-decoration: none;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0112 7.6a4.3 4.3 0 017.5 2.7c0 5.6-7.5 10.2-7.5 10.2z"></path></svg><div style="font-family: 'Young Serif', Georgia, serif; font-size: 22px;">heartworks</div></a><div style="display: flex; gap: 6px; width: 240px;"><div style="flex-grow: 1; height: 4px; border-radius: 4px; background: #1F1A17;"></div><div style="flex-grow: 1; height: 4px; border-radius: 4px; background: #1F1A17;"></div><div style="flex-grow: 1; height: 4px; border-radius: 4px; background: rgba(31,26,23,0.14);"></div></div><a href="DFeed.dc.html" style="font-size: 15px; font-weight: 600; color: #6B5F58; text-decoration: none; padding: 12px 0;">Skip</a></nav><div style="width: 720px; margin: 0 auto; flex-grow: 1; box-sizing: border-box; padding: 40px 0; display: flex; flex-direction: column; gap: 0px;"><div style="padding: 40px; border-radius: 28px; display: flex; flex-direction: column; gap: 28px; background: rgba(255,255,255,0.85); border: 1px solid rgba(31,26,23,0.08); box-shadow: 0 1px 2px rgba(31,26,23,0.04), 0 12px 32px rgba(31,26,23,0.06);"><div style="display: flex; flex-direction: column; gap: 10px;"><h1 style="margin: 0; font-family: 'Young Serif', Georgia, serif; font-weight: 400; font-size: 40px; line-height: 1.08; letter-spacing: -0.8px;">What do you want out of volunteering?</h1><p style="margin: 0; font-size: 17px; line-height: 1.5; color: #6B5F58;">We match on this, not just your free Saturdays. Change it anytime.</p></div><div style="display: flex; flex-direction: column; gap: 12px;"><div style="font-size: 13px; font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase; color: #6B5F58;">I want to learn</div><div style="display: flex; flex-wrap: wrap; gap: 8px;"><sc-for list="{{ learn }}" as="chip" hint-placeholder-count="8"><sc-if value="{{ chip.on }}" hint-placeholder-val="{{ false }}"><button type="button" aria-pressed="true" onClick="{{ chip.toggle }}" style="height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid #1F1A17; background: #1F1A17; color: #FFFFFF; font-size: 15px; font-weight: 500;">{{ chip.label }}</button></sc-if><sc-if value="{{ chip.off }}" hint-placeholder-val="{{ true }}"><button type="button" aria-pressed="false" onClick="{{ chip.toggle }}" style="height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid rgba(31,26,23,0.12); background: rgba(255,255,255,0.75); color: #1F1A17; font-size: 15px; font-weight: 500;">{{ chip.label }}</button></sc-if></sc-for></div></div><div style="display: flex; flex-direction: column; gap: 12px;"><div style="font-size: 13px; font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase; color: #6B5F58;">I can bring</div><div style="display: flex; flex-wrap: wrap; gap: 8px;"><sc-for list="{{ bring }}" as="chip" hint-placeholder-count="6"><sc-if value="{{ chip.on }}" hint-placeholder-val="{{ false }}"><button type="button" aria-pressed="true" onClick="{{ chip.toggle }}" style="height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid #1F1A17; background: #1F1A17; color: #FFFFFF; font-size: 15px; font-weight: 500;">{{ chip.label }}</button></sc-if><sc-if value="{{ chip.off }}" hint-placeholder-val="{{ true }}"><button type="button" aria-pressed="false" onClick="{{ chip.toggle }}" style="height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid rgba(31,26,23,0.12); background: rgba(255,255,255,0.75); color: #1F1A17; font-size: 15px; font-weight: 500;">{{ chip.label }}</button></sc-if></sc-for></div></div><div style="display: flex; align-items: center; justify-content: space-between; padding-top: 8px;"><div style="font-size: 15px; color: #6B5F58;">{{ summary }}</div><a href="DFeed.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; padding: 0 28px; border-radius: 999px; background: #1F1A17; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none; border: 0;">Show my matches</a></div></div></div>

<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D9583B","options":["#D9583B","#C2477A","#2E8B57","#3B6FD9"]},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
state = { learn: ['Mural painting', 'Gardening'], bring: ['Design'] };
renderVals() {
const mk = (labels, key) => labels.map((label) => {
const on = this.state[key].includes(label);
return { label: label, on: on, off: !on, toggle: () => this.setState({ [key]: on ? this.state[key].filter((x) => x !== label) : this.state[key].concat([label]) }) };
});
const n = this.state.learn.length + this.state.bring.length;
return { accent: this.props.accent ?? '#D9583B', learn: mk(['Mural painting', 'Gardening', 'Grant writing', 'Event planning', 'Tutoring', 'Carpentry', 'Organizing', 'Animal care'], 'learn'), bring: mk(['Design', 'Writing', 'Spanish', 'Photography', 'Spreadsheets', 'A truck'], 'bring'), summary: n === 0 ? 'Pick at least one to tune your feed' : n + ' selected' };
}
}
</script>
