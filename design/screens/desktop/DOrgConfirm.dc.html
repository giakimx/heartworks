<nav aria-label="Main" style="display: flex; align-items: center; justify-content: space-between; height: 76px; padding: 0 48px;"><div style="display: flex; align-items: center; gap: 10px;"><a href="DOrgHome.dc.html" style="display: flex; align-items: center; gap: 8px; color: #1F1A17; text-decoration: none;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0112 7.6a4.3 4.3 0 017.5 2.7c0 5.6-7.5 10.2-7.5 10.2z"></path></svg><div style="font-family: 'Young Serif', Georgia, serif; font-size: 22px;">heartworks</div></a><div style="height: 22px; padding: 0 8px; display: flex; align-items: center; border-radius: 999px; background: rgba(31,26,23,0.08); font-size: 11px; font-weight: 700; letter-spacing: 0.4px; color: #6B5F58;">ORGS</div></div><div style="display: flex; align-items: center; gap: 4px;"><a href="DOrgHome.dc.html" style="display: flex; align-items: center; height: 44px; padding: 0 14px; border-radius: 999px; font-size: 15px; font-weight: 600; text-decoration: none; color: #6B5F58; background: transparent;">Home</a><a href="DRequests.dc.html" style="display: flex; align-items: center; height: 44px; padding: 0 14px; border-radius: 999px; font-size: 15px; font-weight: 600; text-decoration: none; color: #6B5F58; background: transparent;">Requests</a><a href="DOrgConfirm.dc.html" style="display: flex; align-items: center; height: 44px; padding: 0 14px; border-radius: 999px; font-size: 15px; font-weight: 600; text-decoration: none; color: #1F1A17; background: rgba(31,26,23,0.07);">Confirm shifts</a></div><div style="display: flex; align-items: center; gap: 12px;"><a href="DPostRole.dc.html" style="display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 18px; border-radius: 999px; background: #1F1A17; color: #FFFFFF; font-size: 14px; font-weight: 600; text-decoration: none;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Post a role</a><div style="display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%; background: #E9A23B; color: #1F1A17; font-size: 13px; font-weight: 700;">DB</div></div></nav><div style="width: 680px; margin: 0 auto; flex-grow: 1; box-sizing: border-box; padding: 24px 0 40px; display: flex; flex-direction: column; gap: 24px;"><div style="display: flex; flex-direction: column; gap: 6px;"><div style="font-size: 15px; font-weight: 500; color: #6B5F58;">Wall prep day · Sat, Sep 12</div><h1 style="margin: 0; font-family: 'Young Serif', Georgia, serif; font-weight: 400; font-size: 44px; line-height: 1.08; letter-spacing: -0.8px;">Who showed up?</h1><p style="margin: 0; font-size: 16px; line-height: 1.5; color: #6B5F58;">Untick anyone who didn't make it. Hours are what they reported.</p></div><div style="display: flex; flex-direction: column; border-radius: 20px; padding: 4px 20px; background: rgba(255,255,255,0.85); border: 1px solid rgba(31,26,23,0.08); box-shadow: 0 1px 2px rgba(31,26,23,0.04), 0 12px 32px rgba(31,26,23,0.06);"><sc-for list="{{ people }}" as="p" hint-placeholder-count="4"><button type="button" aria-pressed="{{ p.pressed }}" onClick="{{ p.toggle }}" style="display: flex; align-items: center; gap: 14px; min-height: 76px; padding: 0; border: 0; border-bottom: 1px solid rgba(31,26,23,0.07); background: transparent; text-align: left; color: #1F1A17;"><div style="flex-shrink: 0; width: 44px; height: 44px; border-radius: 50%; background: {{ p.color }}; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700;">{{ p.initials }}</div><div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;"><div style="font-size: 16px; font-weight: 600;">{{ p.name }}</div><div style="font- <script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D9583B","options":["#D9583B","#C2477A","#2E8B57","#3B6FD9"]},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
state = { out: [] };
renderVals() {
const base = [
{ id: 'a', initials: 'GK', name: 'Gia K.', color: '#F2B8A0', hours: 3, detail: '3 hrs · Surface prep, teamwork' },
{ id: 'b', initials: 'ER', name: 'Elena R.', color: '#A9D4B8', hours: 3, detail: '3 hrs · Surface prep' },
{ id: 'c', initials: 'MT', name: 'Marcus T.', color: '#C9B8E8', hours: 2, detail: '2 hrs · Teamwork' },
{ id: 'd', initials: 'JW', name: 'Jordan W.', color: '#F3D48A', hours: 3, detail: '3 hrs · Surface prep, carpentry' }
];
const out = this.state.out;
const kept = base.filter((p) => !out.includes(p.id));
const hrs = kept.reduce((n, p) => n + p.hours, 0);
return { accent: this.props.accent ?? '#D9583B', people: base.map((p) => { const on = !out.includes(p.id); return Object.assign({}, p, { on: on, off: !on, pressed: on ? 'true' : 'false', toggle: () => this.setState({ out: on ? out.concat([p.id]) : out.filter((x) => x !== p.id) }) }); }), summary: hrs + ' verified hours go on ' + kept.length + (kept.length === 1 ? ' profile' : ' profiles') + ' as stamps.', cta: 'Confirm ' + kept.length + (kept.length === 1 ? ' volunteer' : ' volunteers') };
}
}
</script>
